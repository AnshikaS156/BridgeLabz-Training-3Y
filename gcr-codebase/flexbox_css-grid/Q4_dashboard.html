<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="Q4_dashboard.css">
</head>
<body>
  <div class="dashboard">
    <header class="dashboard-header">
      <div>
        <p class="eyebrow">WORKSPACE</p>
        <h1>Analytics Dashboard</h1>
      </div>
      <div class="profile">AS</div>
    </header>

    <aside class="sidebar">
      <h2>Menu</h2>
      <nav>
        <a href="#" class="active">Overview</a>
        <a href="#">Analytics</a>
        <a href="#">Projects</a>
        <a href="#">Messages</a>
        <a href="#">Settings</a>
      </nav>
    </aside>

    <main class="dashboard-main">
      <section class="box box-wide">
        <div>
          <p class="eyebrow">TOTAL REVENUE</p>
          <h2>₹8,42,500</h2>
          <p class="success">+12.8% this month</p>
        </div>
        <div class="mini-chart" aria-label="Revenue trend illustration"></div>
      </section>

      <section class="box">
        <p class="eyebrow">ORDERS</p>
        <h2>1,284</h2>
        <p class="muted">+8.4% from last month</p>
      </section>

      <section class="box">
        <p class="eyebrow">CUSTOMERS</p>
        <h2>3,642</h2>
        <p class="muted">+5.2% from last month</p>
      </section>

      <section class="box">
        <p class="eyebrow">CONVERSION RATE</p>
        <h2>6.4%</h2>
        <p class="muted">Stable performance</p>
      </section>
    </main>
  </div>
</body>
</html>
