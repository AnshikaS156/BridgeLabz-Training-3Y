<!DOCTYPE html>
<html>
<head>
    <title>Course Registration</title>
</head>
<body>

    <h1>Course Registration Form</h1>

    <form>
        <fieldset>
            <legend>Student Details</legend>

            <label>Name:</label>
            <input type="text" name="name">
            <br><br>

            <label>Email:</label>
            <input type="email" name="email">
            <br><br>

            <label>Select Course:</label>
            <select name="course">
                <option>B.Tech CSE</option>
                <option>B.Tech ECE</option>
                <option>BCA</option>
                <option>MCA</option>
            </select>
            <br><br>

            <input type="submit" value="Register">
        </fieldset>
    </form>

    <h2>Available Course Schedules</h2>

    <table border="1">
        <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Instructor</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>10:00 AM</td>
            <td>Dr. Sharma</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>12:00 PM</td>
            <td>Dr. Verma</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>2:00 PM</td>
            <td>Dr. Singh</td>
        </tr>
    </table>

</body>
</html>
