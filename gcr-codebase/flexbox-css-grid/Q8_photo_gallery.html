<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="Q8_photo_gallery.css">
</head>
<body>
  <header class="gallery-header">
    <p class="eyebrow">VISUAL STORIES</p>
    <h1>Wander & Wonder</h1>
    <p>A responsive gallery built with CSS Grid.</p>
  </header>

  <main class="photo-gallery">
    <figure class="photo-card">
      <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80" alt="Mountain landscape">
      <figcaption>Mountain Morning</figcaption>
    </figure>
    <figure class="photo-card">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Person near a mountain lake">
      <figcaption>Quiet Escape</figcaption>
    </figure>
    <figure class="photo-card">
      <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=900&q=80" alt="Green mountain valley">
      <figcaption>Wild Valley</figcaption>
    </figure>
    <figure class="photo-card">
      <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Cabin beside a lake">
      <figcaption>Lake Cabin</figcaption>
    </figure>
    <figure class="photo-card">
      <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80" alt="Snowy mountain peaks">
      <figcaption>Snow Peaks</figcaption>
    </figure>
    <figure class="photo-card">
      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Sunlight through a forest">
      <figcaption>Forest Light</figcaption>
    </figure>
  </main>

  <footer>
    <p>© 2026 Wander & Wonder</p>
  </footer>
</body>
</html>
